<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Photo Swipe — Web Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            color: #e3e3e3;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #90CAF9;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading…</div>
    <script src="photoswipe.js"></script>
</body>
</html>
